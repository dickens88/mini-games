<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rally Pals — a two-player tennis game</title>
<meta name="description" content="Grab a friend and a racket! A bouncy two-player tennis game on one screen: drives, lobs, jumping smashes and silly power-ups on four courts — garden, beach, ice and the Moon. Or play the computer.">
<meta name="theme-color" content="#8FD3FF">
<link rel="icon" href="/assets/favicon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/favicon.png">
<link rel="canonical" href="https://games.dearcharles.cn/games/rally-pals/">
<meta property="og:type" content="website">
<meta property="og:title" content="Rally Pals — two-player tennis with cute pals">
<meta property="og:description" content="Same-screen tennis for two: smash, lob and bonk the ball with power-ups on four silly courts.">
<meta property="og:url" content="https://games.dearcharles.cn/games/rally-pals/">
<meta property="og:image" content="https://games.dearcharles.cn/games/rally-pals/cover.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script type="module" src="js/main.js"></script>
</head>
<body>

<nav class="site-nav">
  <a href="/">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    All games
  </a>
  <span class="grow"></span>
  <button class="icon-btn" id="helpBtn" type="button" aria-label="How to play" title="How to play (H)"><b>?</b></button>
  <button class="icon-btn" id="menuBtn" type="button" aria-label="Pause and menu" title="Pause (Esc)">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg>
  </button>
  <button class="icon-btn" id="soundBtn" type="button" aria-label="Sound" aria-pressed="true" title="Sound (M)">
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/><path class="on" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="off" d="M16 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
</nav>

<div class="page">
  <header class="hero"><h1>Rally Pals</h1></header>

  <div class="hud" id="hud" aria-live="polite">
    <div class="side p1">
      <canvas class="face" data-hud="face0" aria-hidden="true"></canvas>
      <div class="who"><b data-hud="name0"></b><small><span data-hud="tag0"></span> <span class="serve" data-hud="serve0" title="Serving">● serve</span></small><span class="games" data-hud="games0"></span></div>
      <b class="pts" data-hud="pts0">0</b>
    </div>
    <div class="mid" data-hud="mid"></div>
    <div class="side p2">
      <b class="pts" data-hud="pts1">0</b>
      <div class="who"><b data-hud="name1"></b><small><span class="serve" data-hud="serve1" title="Serving">serve ●</span> <span data-hud="tag1"></span></small><span class="games" data-hud="games1"></span></div>
      <canvas class="face" data-hud="face1" aria-hidden="true"></canvas>
    </div>
  </div>

  <div class="arena">
    <div class="pad pad1" aria-label="Player 1 buttons">
      <button type="button" data-p="0" data-a="left" aria-label="Player 1 run left"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg></button>
      <button type="button" data-p="0" data-a="right" aria-label="Player 1 run right"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></svg></button>
      <button type="button" data-p="0" data-a="jump" class="act" aria-label="Player 1 jump"><svg viewBox="0 0 24 24"><path d="M6 14l6-6 6 6M12 8v11" /></svg></button>
      <button type="button" data-p="0" data-a="swing" class="act swing" aria-label="Player 1 swing"><svg viewBox="0 0 24 24"><ellipse cx="14.5" cy="8.5" rx="5.6" ry="6.8" transform="rotate(40 14.5 8.5)"/><path d="M12 6.5l5 4.5M14 4.5l4.5 4M10.5 9.5l4.2 3.6M10.2 13.6L4 20" /><circle cx="5" cy="7" r="2.2" class="ball"/></svg></button>
    </div>
    <div class="board-wrap">
      <canvas id="court" aria-label="Tennis court seen from the side: player 1 on the left, player 2 on the right, the net in the middle."></canvas>
      <div class="overlay" id="overlay" hidden><div class="card"></div></div>
    </div>
    <div class="pad pad2" aria-label="Player 2 buttons">
      <button type="button" data-p="1" data-a="swing" class="act swing" aria-label="Player 2 swing"><svg viewBox="0 0 24 24"><g transform="matrix(-1 0 0 1 24 0)"><ellipse cx="14.5" cy="8.5" rx="5.6" ry="6.8" transform="rotate(40 14.5 8.5)"/><path d="M12 6.5l5 4.5M14 4.5l4.5 4M10.5 9.5l4.2 3.6M10.2 13.6L4 20" /><circle cx="5" cy="7" r="2.2" class="ball"/></g></svg></button>
      <button type="button" data-p="1" data-a="jump" class="act" aria-label="Player 2 jump"><svg viewBox="0 0 24 24"><path d="M6 14l6-6 6 6M12 8v11" /></svg></button>
      <button type="button" data-p="1" data-a="left" aria-label="Player 2 run left"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg></button>
      <button type="button" data-p="1" data-a="right" aria-label="Player 2 run right"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></svg></button>
    </div>
  </div>

  <div class="keys-help">
    <span class="k1"><i class="dot p1"></i><kbd>A</kbd><kbd>D</kbd> run · <kbd>W</kbd> jump · <kbd>S</kbd> swing</span>
    <span class="k2"><i class="dot p2"></i><kbd>←</kbd><kbd>→</kbd> run · <kbd>↑</kbd> jump · <kbd>↓</kbd> swing</span>
    <span>Hold toward the net for a drive, away for a lob · <kbd>Esc</kbd> pause</span>
  </div>
  <p class="turn-hint">Turn your device sideways for a bigger court.</p>
</div>

<script>if ('serviceWorker' in navigator) window.addEventListener('load', function(){ navigator.serviceWorker.register('/sw.js').catch(function(){}); });</script>
</body>
</html>
